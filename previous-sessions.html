<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>الجلسات السابقة</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =========================
         الرأس
    ========================== -->

    <header class="header">

        <h1 id="page-title">
            الجلسات السابقة
        </h1>

    </header>


    <!-- =========================
         الأزرار
    ========================== -->

    <!-- زر اللغة -->

<button
    id="language-button"
    class="language-button"
    type="button"
>
    EN
</button>


<!-- زر الإعدادات -->

<button
    id="settings-button"
    class="settings-button"
    type="button"
    aria-label="الإعدادات"
    title="الإعدادات"
>

    <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
    >

        <path
            d="M12 15.5
               A3.5 3.5 0 1 0
               12 8.5
               A3.5 3.5 0 0 0
               12 15.5Z"
            stroke="currentColor"
            stroke-width="1.8"
        />

        <path
            d="M19.4 15
               L21 16
               L19 19
               L17.3 18
               C16.8 18.3 16.3 18.6 15.7 18.8
               L15.5 21
               H12.5
               L12.3 18.8
               C11.7 18.6 11.2 18.3 10.7 18
               L9 19
               L7 16
               L8.6 15
               C8.5 14.4 8.5 13.8 8.6 13.2
               L7 12
               L9 9
               L10.7 10
               C11.2 9.7 11.7 9.4 12.3 9.2
               L12.5 7
               H15.5
               L15.7 9.2
               C16.3 9.4 16.8 9.7 17.3 10
               L19 9
               L21 12
               L19.4 13.2
               C19.5 13.8 19.5 14.4 19.4 15Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
        />

    </svg>

</button>

    <!-- =========================
         الإحصائيات
    ========================== -->

    <section class="study-summary">

        <h2 id="total-study-label">
            إجمالي وقت الدراسة
        </h2>

        <div id="total-study-time">
            00:00:00
        </div>


        <h2 id="session-count-label">
            عدد الجلسات
        </h2>

        <div id="session-count">
            0
        </div>

    </section>


    <!-- =========================
         الجلسات
    ========================== -->

    <section class="previous-sessions-section">

        <table class="sessions-table">

            <thead>

                <tr>

                    <th id="date-header">
                        التاريخ
                    </th>

                    <th id="subject-header">
                        المادة
                    </th>

                    <th id="duration-header">
                        مدة الجلسة
                    </th>

                    <th id="notes-header">
                        الملاحظات
                    </th>

                    <th></th>

                </tr>

            </thead>


            <tbody id="sessions-container"></tbody>

        </table>

    </section>


    <script src="previous-sessions.js"></script>

</body>

</html>
