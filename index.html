<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>متابع الدراسة الشخصي</title>

    <!-- خط ثمانية -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@dawod/thmanyah-font-web/index.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- أزرار أعلى الصفحة -->

    <div class="top-actions">

        <!-- زر اللغة -->

        <button
            id="language-button"
            class="language-button"
            aria-label="تغيير اللغة"
            title="تغيير اللغة"
        >
            EN
        </button>


        <!-- زر الإعدادات -->

        <button
            id="settings-button"
            class="settings-button"
            aria-label="الإعدادات"
            title="الإعدادات"
        >

            <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >

                <path
                    d="M12 15.5A3.5 3.5 0 1 0 12 8.5A3.5 3.5 0 0 0 12 15.5Z"
                    stroke="currentColor"
                    stroke-width="1.8"
                />

                <path
                    d="M19.4 15A1.7 1.7 0 0 0 21 13.3V10.7A1.7 1.7 0 0 0 19.4 9L18.7 8.7A1.7 1.7 0 0 0 17.9 7.1L18 6.3A1.7 1.7 0 0 0 16.3 4.6L14.8 5.2A1.7 1.7 0 0 0 13 4.2L12.8 3.5A1.7 1.7 0 0 0 11.2 3.5L11 4.2A1.7 1.7 0 0 0 9.2 5.2L7.7 4.6A1.7 1.7 0 0 0 6 6.3L6.1 7.1A1.7 1.7 0 0 0 5.3 8.7L4.6 9A1.7 1.7 0 0 0 3 10.7V13.3A1.7 1.7 0 0 0 4.6 15L5.3 15.3A1.7 1.7 0 0 0 6.1 16.9L6 17.7A1.7 1.7 0 0 0 7.7 19.4L9.2 18.8A1.7 1.7 0 0 0 11 19.8L11.2 20.5A1.7 1.7 0 0 0 12.8 20.5L13 19.8A1.7 1.7 0 0 0 14.8 18.8L16.3 19.4A1.7 1.7 0 0 0 18 17.7L17.9 16.9A1.7 1.7 0 0 0 18.7 15.3L19.4 15Z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linejoin="round"
                />

            </svg>

        </button>

    <button
    id="plans-button"
    class="plans-button"
    type="button"
>
    الخطط
</button> 


    </div>


    <!-- العنوان -->

    <header class="header">

        <h1>
            متابع الدراسة الشخصي
        </h1>

    </header>


    <main class="dashboard">


        <!-- التاريخ -->

        <section class="date-section">

            <p
                class="current-date"
                id="current-date"
            ></p>

        </section>


        <!-- الستريك -->

        <section class="streak-section">

            <span class="streak-fire">
                🔥
            </span>

            <div>

                <p
                    class="streak-number"
                    id="streak-count"
                >
                    0
                </p>

                <p class="streak-label">
                    يوم متواصل
                </p>

            </div>

        </section>


        <!-- ملخص الدراسة -->

        <section class="study-summary">

            <h2>
                إجمالي دراسة اليوم
            </h2>

            <p
                class="total-time"
                id="today-total"
            >
                00:00:00
            </p>

            <p class="current-session">

                الجلسة الحالية:

                <span id="timer">
                    00:00:00
                </span>

            </p>

        </section>


        <!-- اختيار المادة -->

        <section class="subject-section">

            <label for="subject">
                اختر المادة
            </label>

            <select id="subject">

                <option value="">
                    اختر المادة
                </option>

            </select>

<p
    id="no-subjects-message"
    class="no-subjects-message"
>
    أضف المواد من الإعدادات
</p>
<section class="session-task-section">

    <label id="session-task-label" for="session-task">
        المهام المراد إنجازها
    </label>

    <textarea
        id="session-task"
        placeholder="اكتبي المهمة التي تريدين إنجازها..."
    ></textarea>

</section>



            <!-- نوع الجلسة -->

           <section class="session-type-section">

    <label for="session-type">
        نوع الجلسة
    </label>

    <select id="session-type">

        <option value="normal">
            جلسة عادية
        </option>

        <option value="pomodoro">
            جلسة بومودورو - 25 دقيقة
        </option>

    </select>

</section>

        </section>


        <!-- ملاحظة الجلسة -->

        <section class="notes-section">

            <label for="session-note">
                ملاحظة الجلسة
            </label>

            <textarea
                id="session-note"
                placeholder="اكتب ملاحظة عن جلسة الدراسة..."
                rows="3"
            ></textarea>

        </section>


        <!-- أزرار الجلسة -->

        <section class="session-controls">

            <button id="start-session">
                بدء الجلسة
            </button>

            <button id="pause-session">
                إيقاف مؤقت
            </button>

            <button id="resume-session">
                استئناف
            </button>

            <button id="add-session">
                إضافة جلسة
            </button>

        </section>


        <!-- العبارة التحفيزية -->

        <section class="motivation">

            <p>
                تبنى الجبال من مستصغر الحجر
            </p>

        </section>


        <!-- الجلسات السابقة -->

        <section class="previous-sessions">

            <button id="previous-sessions-btn">
                الجلسات السابقة
            </button>

        </section>


    </main>
    <!-- نافذة حالة المهمة -->
<div id="task-status-modal" class="task-status-modal">

    <div class="task-status-box">

        <h2 id="task-status-title">
            حالة المهمة
        </h2>

        <p id="task-status-text">
            ماذا أنجزتِ من المهمة؟
        </p>

        <div class="task-status-buttons">

            <button
                id="task-completed"
                type="button"
            >
                تمت
            </button>

            <button
                id="task-partial"
                type="button"
            >
                تمت جزئيًا
            </button>

            <button
                id="task-not-completed"
                type="button"
            >
                لم تتم
            </button>

        </div>

    </div>

</div>

    <script src="script.js"></script>

</body>

</html>
